<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Scale Workshop">
  <title>Scale Workshop</title>
  <rect width="32" height="32" rx="7" fill="#8b7cf6"/>
  <!-- Three noteheads climbing like steps: a scale, both senses of the word.
       Kept to big shapes and thick stems so it still reads at 16px. -->
  <g fill="#191033">
    <ellipse cx="8" cy="23.5" rx="4.3" ry="3.3" transform="rotate(-20 8 23.5)"/>
    <rect x="10.4" y="14.5" width="2.5" height="9.4" rx="1.25"/>
    <ellipse cx="16" cy="17.5" rx="4.3" ry="3.3" transform="rotate(-20 16 17.5)"/>
    <rect x="18.4" y="8.5" width="2.5" height="9.4" rx="1.25"/>
    <ellipse cx="24" cy="11.5" rx="4.3" ry="3.3" transform="rotate(-20 24 11.5)"/>
    <rect x="26.4" y="2.5" width="2.5" height="9.4" rx="1.25"/>
  </g>
</svg>
